name: Build Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask flask-cors pystray pillow
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Executable
        run: |
          pyinstaller --onefile --noconsole --hidden-import=pystray --hidden-import=pystray._win32 --hidden-import=PIL --hidden-import=flask --name "PSIV-Auto-Tracker" relay_sniffer.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSIV-Auto-Tracker-Windows
          path: dist/*.exe
